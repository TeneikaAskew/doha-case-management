name: Deploy portal to GitHub Pages

on:
  push:
    branches: [vetting-portal, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # Live chat integration: real Gemini call through answerQuestion.
      # REQUIRE_GEMINI makes a missing/misnamed secret fail the deploy instead
      # of silently shipping a keyless (simulated-only) bundle.
      - name: Gemini live chat test
        run: npx vitest run src/__tests__/geminiLive.integration.test.js
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REQUIRE_GEMINI: '1'
      # VITE_GEMINI_API_KEY is baked into the public bundle by design (demo).
      # The key MUST be restricted in Google Cloud: website restriction to this
      # Pages origin, API restriction to the Generative Language API, low quota.
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Mirrors the build to Cloudflare Pages (doha-case-management.pages.dev).
  # Skipped until the CLOUDFLARE_API_TOKEN secret exists ("Cloudflare Pages:
  # Edit" permission, created at dash.cloudflare.com -> My Profile -> API Tokens).
  deploy-cloudflare:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal
          command: pages deploy dist --project-name doha-case-management --branch vetting-portal
      - name: Note when skipped
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN secret not set - skipped Cloudflare deploy."
