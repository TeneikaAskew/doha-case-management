name: Deploy portal to GitHub Pages

on:
  push:
    branches: [vetting-portal, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # VITE_GEMINI_API_KEY is baked into the public bundle by design (demo).
      # The key MUST be restricted in Google Cloud: website restriction to this
      # Pages origin, API restriction to the Generative Language API, low quota.
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
